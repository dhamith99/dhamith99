<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="230" viewBox="0 0 1000 230" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8E2DE2"/>
      <stop offset="0.5" stop-color="#4A00E0"/>
      <stop offset="1" stop-color="#00C6FF"/>
    </linearGradient>
    <clipPath id="clip"><rect width="1000" height="230" rx="0"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1000" height="230" fill="url(#bg)"/>
    <g fill="#ffffff" fill-opacity="0.10">
      <path d="M0 170 Q125 130 250 170 T500 170 T750 170 T1000 170 T1250 170 T1500 170 V230 H0 Z">
        <animateTransform attributeName="transform" type="translate" from="0 0" to="-500 0" dur="9s" repeatCount="indefinite"/>
      </path>
    </g>
    <g fill="#ffffff" fill-opacity="0.16">
      <path d="M0 190 Q125 160 250 190 T500 190 T750 190 T1000 190 T1250 190 T1500 190 V230 H0 Z">
        <animateTransform attributeName="transform" type="translate" from="-500 0" to="0 0" dur="7s" repeatCount="indefinite"/>
      </path>
    </g>
    <g fill="#ffffff">
      <circle cx="120" cy="50" r="2"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.5s" repeatCount="indefinite"/></circle>
      <circle cx="300" cy="30" r="1.5"><animate attributeName="opacity" values="1;0.2;1" dur="3s" repeatCount="indefinite"/></circle>
      <circle cx="520" cy="45" r="2"><animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/></circle>
      <circle cx="760" cy="28" r="1.5"><animate attributeName="opacity" values="1;0.2;1" dur="3.5s" repeatCount="indefinite"/></circle>
      <circle cx="900" cy="60" r="2"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.8s" repeatCount="indefinite"/></circle>
      <circle cx="60" cy="110" r="1.5"><animate attributeName="opacity" values="1;0.3;1" dur="2.2s" repeatCount="indefinite"/></circle>
      <circle cx="940" cy="120" r="1.5"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.2s" repeatCount="indefinite"/></circle>
    </g>
    <text x="500" y="100" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="50" font-weight="700" fill="#ffffff">
      Dhamith Gunawardhana
      <animate attributeName="opacity" from="0" to="1" dur="1.4s" fill="freeze"/>
    </text>
    <text x="500" y="145" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#ffffff" fill-opacity="0.92">
      Data Science Undergraduate • Aspiring Data Engineer &amp; ML Engineer
      <animate attributeName="opacity" from="0" to="1" begin="0.6s" dur="1.4s" fill="freeze"/>
    </text>
  </g>
</svg>
